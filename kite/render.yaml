# Kite's Render demo service. This is a testnet-only configuration.
# Free instances sleep after inactivity; upgrade in Render before a live event if needed.
services:
  - type: web
    name: kite-monad-payments
    runtime: node
    # The app and package-lock.json live in kite/ inside this monorepo.
    # Without rootDir, Render runs `npm ci` at the repo root, which has no
    # lockfile, and npm fails with EUSAGE (the long usage dump in the log).
    rootDir: kite
    plan: free
    region: singapore
    branch: main
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    autoDeployTrigger: commit
    envVars:
      - key: NODE_VERSION
        value: "24.21.0"
      # Server-only Alchemy key for the Monad testnet RPC proxy. Render prompts for the value
      # (sync: false) so it is never committed. Leave empty to use the public Monad RPC.
      - key: ALCHEMY_API_KEY
        sync: false
